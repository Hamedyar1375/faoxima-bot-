server {
    listen 80;
    server_name faoxima.downloadbazi.fun;
    server_tokens off;
    root /var/www/faoxima;
    index index.php;
    client_max_body_size 116M;
    keepalive_timeout 65s;
    gzip on;
    gzip_types application/json text/plain;

    location ~ /\..* { deny all; return 404; }
    
    location ~* ^/(?:\..*|.*/\..*) { deny all; return 404; }
    location ~* \.(?:env|ya?ml|sql|log|sh|json|bak|lock|md|conf|ini|zip|tmp|err|swp|orig)$ { deny all; return 404; }
    location ~* (?:.*/)?(?:error_log|hash\.txt)$ { deny all; return 404; }
    
    location ^~ /installer/    { deny all; return 403; }
    location ^~ /storage/      { deny all; return 403; }
    location ^~ /logs/         { deny all; return 403; }
    location ^~ /api/handlers/ { deny all; return 403; }

    # Mini App frontend and its SPA fallback. PHP files below /app/ are still
    # handled by the global \.php$ location below.
    location /app/ {
        try_files $uri $uri/ /app/index.php$is_args$args;
    }

    # Main web administration panel. This path must never fall through to the
    # root redirect/mini-app rule.
    location /panel/ {
        try_files $uri $uri/ /panel/index.php$is_args$args;
    }

    # Legacy URL_PATH prefix support. Telegram/BotFather may still open the
    # Mini App as /faoxima/app/ (URL_PATH=faoxima), so app/cron subpaths must
    # win over the panel alias below.
    location = /faoxima/app { return 301 https://$host/app/; }
    location ^~ /faoxima/app/ { rewrite ^/faoxima/app/(.*)$ https://$host/app/$1 permanent; }
    location = /faoxima/cron { return 301 https://$host/cron/; }
    location ^~ /faoxima/cron/ { rewrite ^/faoxima/cron/(.*)$ https://$host/cron/$1 permanent; }
    location = /foxima/app { return 301 https://$host/app/; }
    location ^~ /foxima/app/ { rewrite ^/foxima/app/(.*)$ https://$host/app/$1 permanent; }

    # Explicit panel aliases only. These must never catch /faoxima/app/.
    location = /foxima { return 302 https://$host/panel/login.php; }
    location ^~ /foxima/ { return 302 https://$host/panel/login.php; }
    location = /faoxima { return 302 https://$host/panel/login.php; }
    location ^~ /faoxima/ { return 302 https://$host/panel/login.php; }

    # Browser visits to the site root should open the Mini App, not the
    # Telegram webhook entrypoint.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 https://$host/app/;
    }

    # The root index.php is the Telegram webhook (POST). A browser GET must not
    # be treated as a webhook request; route it to the Mini App instead.
    location = /index.php {
        if ($request_method = GET) {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 302 https://$host/app/;
        }
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_INIT_DATA $http_x_telegram_init_data;
        fastcgi_param HTTP_X_FX_TENANT $http_x_fx_tenant;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_INIT_DATA $http_x_telegram_init_data;
        fastcgi_param HTTP_X_FX_TENANT $http_x_fx_tenant;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
