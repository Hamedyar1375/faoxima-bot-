server {
    listen 80;
    server_name faoxima.downloadbazi.fun;
    server_tokens off;
    root /var/www/faoxima;
    index index.php;
    client_max_body_size 116M;
    keepalive_timeout 65s;
    gzip on;
    gzip_types application/json text/plain;

    location ~ /\..* { deny all; return 404; }
    
    location ~* ^/(?:\..*|.*/\..*) { deny all; return 404; }
    location ~* \.(?:env|ya?ml|sql|log|sh|json|bak|lock|md|conf|ini|zip|tmp|err|swp|orig)$ { deny all; return 404; }
    location ~* (?:.*/)?(?:error_log|hash\.txt)$ { deny all; return 404; }
    
    location ^~ /installer/    { deny all; return 403; }
    location ^~ /storage/      { deny all; return 403; }
    location ^~ /logs/         { deny all; return 403; }
    location ^~ /api/handlers/ { deny all; return 403; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
