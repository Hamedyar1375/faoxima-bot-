server {
    listen 80;
    server_name faoxima.downloadbazi.fun;
    server_tokens off;
    index index.php;
    client_max_body_size 116M;
    keepalive_timeout 65s;
    gzip on;
    gzip_types application/json text/plain;

    location ~ /\..* { deny all; return 404; }

    # hide sensitive paths
    location ~* ^/faoxima/(?:\..*|.*/\..*) { deny all; return 404; }
    location ~* ^/faoxima/.*\.(?:env|ya?ml|sql|log|sh|json|bak|lock|md|conf|ini|zip|tmp|err|swp|orig)$ { deny all; return 404; }
    location ~* ^/faoxima/(?:.*/)?(?:error_log|hash\.txt)$ { deny all; return 404; }
    location ^~ /faoxima/installer/    { deny all; return 403; }
    location ^~ /faoxima/storage/      { deny all; return 403; }
    location ^~ /faoxima/logs/         { deny all; return 403; }
    location ^~ /faoxima/api/handlers/ { deny all; return 403; }

    # static assets
    location ~* ^/faoxima/app/.*\.(?:js|mjs)$ {
        root /var/www;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~* ^/faoxima/app/.*\.css$ {
        root /var/www;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~* ^/faoxima/app/.*\.(?:woff2?|svg|png|jpe?g|gif|ico)$ {
        root /var/www;
        add_header Cache-Control "public, max-age=2592000";
    }

    # PHP handler for vpnbot (reseller bots) UNDER /faoxima/ - MUST come before main faoxima php handler
    location ~ ^/faoxima/vpnbot/(.*\.php)$ {
        root /var/www;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/faoxima/vpnbot/$1;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # PHP handler for the main app
    location ~ ^/faoxima/(.*\.php)$ {
        root /var/www;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/faoxima/$1;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # SPA mini-app + sub fallbacks
    location /faoxima/app/ {
        root /var/www;
        try_files $uri $uri/ /faoxima/app/index.php$is_args$args;
    }
    location /faoxima/sub/ {
        root /var/www;
        try_files $uri $uri/ /faoxima/sub/index.php;
    }
    location /faoxima/ {
        root /var/www;
        try_files $uri $uri/ =404;
    }

    # per-reseller bots (vpnbot) - direct access (if any)
    location ~ ^/vpnbot/(.*\.php)$ {
        root /var/www;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/faoxima/vpnbot/$1;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN $http_x_telegram_bot_api_secret_token;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location /vpnbot/ {
        root /var/www;
        try_files $uri $uri/ =404;
    }
}
